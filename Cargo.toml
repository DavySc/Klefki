[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/cli", "crates/fake-claude", "crates/fake-mcp-server"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
