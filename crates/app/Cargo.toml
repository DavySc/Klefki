[package]
name = "klefki"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
klefki-core = { path = "../core" }
egui = "0.36"
eframe = { version = "=0.36.1", default-features = false, features = ["glow", "accesskit", "persistence", "default_fonts", "wayland", "x11"] }
egui_extras = "=0.36.1"
egui-phosphor = "0.14"

[dev-dependencies]
egui_kittest = { version = "=0.36.1", features = ["eframe"] }
