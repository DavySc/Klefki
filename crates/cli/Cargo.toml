[package]
name = "klefki-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "klefki-cli"
path = "src/main.rs"

[dependencies]
klefki-core = { path = "../core" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
# Golden files for the output tests (`tests/golden/`), as rust-analyzer uses it.
expect-test = "1"
tempfile = "3"

# A terminal for the tests of what `klefki-cli` does when someone is there to answer (the same crate as core's
# sign-in uses, so nothing new is built).
[target.'cfg(unix)'.dev-dependencies]
portable-pty = "0.9"
