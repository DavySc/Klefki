[package]
name = "klefki-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
directories = "6"
url = "2"
regex = "1"
tempfile = "3"
sha2 = "0.10"
memchr = "2"
keyring-core = "1"
zeroize = "1"
# `claude mcp login` needs a terminal (decision 005).
portable-pty = "0.9"
# Opens a checked https sign-in page: ShellExecute on Windows, never `cmd /c start` (no shell).
open = { version = "5", features = ["shellexecute-on-windows"] }
# The system's own save dialog for Export: the common dialog on Windows, NSSavePanel on macOS, the desktop portal
# (libdbus, loaded when used) or zenity on Linux. No GTK.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# The save dialog belongs to Klefki's window: its handle, and waiting for the dialog's answer off the UI thread.
raw-window-handle = "0.6"
pollster = "0.4"

# Ending a process together with what it started: a process group on Unix, a job object on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Time",
]

# The OS's own secret store, one per platform; there is no plaintext fallback.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
wayland-backend = { version = "0.3", optional = true, features = ["dlopen"] }

[features]
# On Wayland, the save dialog is told which window it belongs to. Only the app turns this on: libwayland is loaded
# when the dialog opens (dlopen), as the app's window loads it already, so nothing new is linked and klefki-cli
# never needs it.
wayland = ["rfd/wayland", "dep:wayland-backend"]

[dev-dependencies]
filetime = "0.2"
proptest = "1"
