[package]
name = "klefki-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
directories = "6"
url = "2"
regex = "1"
tempfile = "3"
sha2 = "0.10"
memchr = "2"

[dev-dependencies]
filetime = "0.2"
