[package]
name = "klefki-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
directories = "6"
url = "2"
regex = "1"
tempfile = "3"
sha2 = "0.10"
memchr = "2"
keyring-core = "1"
zeroize = "1"
# `claude mcp login` needs a terminal (decision 005).
portable-pty = "0.9"
# Opens a checked https sign-in page: ShellExecute on Windows, never `cmd /c start` (no shell).
open = { version = "5", features = ["shellexecute-on-windows"] }

# The OS's own secret store, one per platform; there is no plaintext fallback.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
filetime = "0.2"
