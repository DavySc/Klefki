name: release
# Builds the installers for Windows, macOS and Linux with SBOMs, checksums and build provenance. A `v*` tag
# publishes them as a draft GitHub Release; a manual run keeps them as workflow artifacts. Never runs on pull requests (the macOS
# job is billed at 10x). See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8
  CARGO_CYCLONEDX_VERSION: 0.5.9

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            system: windows
          - os: macos-latest
            system: macos
          # The oldest supported runner, so the binaries run on older glibc versions too.
          - os: ubuntu-22.04
            system: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libfuse2
      # Pinned to a commit: this action builds the binaries we publish. The SHA is the `stable` branch on 2026-10-19.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}
      # No build cache: a release is built from scratch, and caches saved under a tag could not be reused.
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version "$CARGO_PACKAGER_VERSION"
      - name: Install cargo-cyclonedx
        if: runner.os == 'Linux'
        run: cargo install cargo-cyclonedx --locked --version "$CARGO_CYCLONEDX_VERSION"

      - name: Version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "klefki"))')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build (Windows, Linux)
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p klefki -p klefki-cli
      - name: Build (macOS, Intel and Apple silicon in one binary)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --release --locked -p klefki -p klefki-cli --target "$target"
          done
          mkdir -p target/universal-apple-darwin/release
          for bin in klefki klefki-cli; do
            lipo -create -output "target/universal-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin" "target/aarch64-apple-darwin/release/$bin"
          done

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          base="klefki-$VERSION"
          case "${{ matrix.system }}" in
            windows)
              cargo packager --release -p klefki -f nsis,wix -o "$GITHUB_WORKSPACE/target/packages"
              cp target/packages/*-setup.exe "dist/$base-windows-x64-setup.exe"
              cp target/packages/*.msi "dist/$base-windows-x64.msi"
              mkdir portable
              cp target/release/klefki.exe target/release/klefki-cli.exe LICENSE-MIT LICENSE-APACHE README.md portable/
              (cd portable && 7z a -tzip "../dist/$base-windows-x64.zip" .)
              ;;
            macos)
              cargo packager --release -p klefki -f app --target universal-apple-darwin -o "$GITHUB_WORKSPACE/target/packages"
              # Ad-hoc signature (free; no Apple account), inside out. Gatekeeper still asks once, since the app is
              # not notarised, but without it macOS on Apple silicon can call the downloaded app damaged.
              app=target/packages/Klefki.app
              codesign --force --sign - "$app/Contents/MacOS/klefki-cli"
              codesign --force --sign - "$app"
              # The disk image is made here rather than by cargo-packager, which would rebuild the unsigned app.
              mkdir dmg
              ditto "$app" dmg/Klefki.app
              ln -s /Applications dmg/Applications
              hdiutil create -volname Klefki -srcfolder dmg -fs HFS+ -format UDZO "dist/$base-macos-universal.dmg"
              ;;
            linux)
              cargo packager --release -p klefki -f deb,appimage -o "$GITHUB_WORKSPACE/target/packages"
              cp target/packages/*.deb "dist/$base-linux-amd64.deb"
              cp target/packages/*.AppImage "dist/$base-linux-x86_64.AppImage"
              # One SBOM per program, listing the dependencies for every target, so it covers all three systems.
              cargo cyclonedx -f json --spec-version 1.5 --describe binaries --no-build-deps --target all
              cp crates/app/klefki_bin.cdx.json "dist/klefki-$VERSION.cdx.json"
              cp crates/cli/klefki-cli_bin.cdx.json "dist/klefki-cli-$VERSION.cdx.json"
              ;;
          esac
          ls -l dist

      - name: Check the packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "${{ matrix.system }}" == macos ]]; then
            # Checks the app as users get it: from inside the disk image.
            hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "dist/klefki-$VERSION-macos-universal.dmg"
            trap 'hdiutil detach "$RUNNER_TEMP/dmg"' EXIT
            python3 scripts/check-release.py macos dist "$VERSION" --app "$RUNNER_TEMP/dmg/Klefki.app"
          else
            python3 scripts/check-release.py ${{ matrix.system }} dist "$VERSION"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.system }}
          path: dist/*
          if-no-files-found: error

  # Signs SHA256SUMS with minisign once `minisign.pub` is committed (before that the script only prints a
  # notice). The key is a secret of the `release` environment, which only main and `v*` tags may use, so a
  # workflow on any other branch cannot read it. This job only computes the checksums the publish job will
  # compute too, and hands over the signature alone.
  sign:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A tag can point at any commit, also one whose workflow was changed and never reviewed. The tag ruleset and
      # the environment's required reviewer (docs/RELEASING.md) stop that; this catches a tag set on the wrong
      # commit by mistake.
      - name: Only commits on main
        run: |
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is $GITHUB_SHA, which is not on main. Releases are made from main only."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true
      - name: Install minisign
        run: |
          if [[ -f minisign.pub ]]; then sudo apt-get update && sudo apt-get install -y minisign; fi
      - name: Sign the checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          scripts/sign-checksums.sh dist/SHA256SUMS "Klefki SHA256SUMS, $GITHUB_REF_NAME, commit $GITHUB_SHA"
          mkdir signature
          if [[ -f dist/SHA256SUMS.minisig ]]; then cp dist/SHA256SUMS.minisig signature/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: klefki-signature
          path: signature/
          if-no-files-found: ignore

  # Checksums and provenance for every run, so a manual run's files can be checked like a release's.
  # Only a tag publishes them.
  publish:
    needs: [build, sign]
    # Runs when signing was skipped (other branches) but not when it failed.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.sign.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signs the build provenance with GitHub's OIDC identity and stores it as an attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      # The sign job's signature, when there is one. Checked against the committed key, so a signature that
      # does not match these exact checksums fails here.
      - uses: actions/download-artifact@v4
        if: needs.sign.result == 'success'
        with:
          name: klefki-signature
          path: dist
      - name: Check the signature
        run: |
          if [[ -f dist/SHA256SUMS.minisig ]]; then
            sudo apt-get update && sudo apt-get install -y minisign
            minisign -V -p minisign.pub -m dist/SHA256SUMS
          elif [[ -f minisign.pub && "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::minisign.pub is committed but this release has no signature."
            exit 1
          fi
      # Records which workflow, commit and runner built each file, signed through Sigstore. Anyone can check a
      # download with the `gh attestation verify` command in docs/release-notes.md; the next step runs the same check.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Check the attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in dist/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" > /dev/null
            echo "attested: $file"
          done
      # A tag publishes these files in the release instead.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: klefki-all
          path: dist/*
          if-no-files-found: error
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The notes name each file exactly, so their commands can be pasted as they are.
          sed "s/{version}/$version/g" docs/release-notes.md > "$RUNNER_TEMP/notes.md"
          # The signature check goes before the checksum commands, or the notes are left without it.
          if [[ -f dist/SHA256SUMS.minisig ]]; then
            sed "s|{pubkey}|$(sed -n 2p minisign.pub)|g; s/{version}/$version/g" docs/release-notes-minisign.md > "$RUNNER_TEMP/minisign.md"
          else
            : > "$RUNNER_TEMP/minisign.md"
          fi
          sed -i -e "/^{minisign}\$/{r $RUNNER_TEMP/minisign.md" -e "d}" "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "Klefki $version" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
