name: quality
# Heavy checks that make simplifying the code safe: line coverage, the start-up and memory baseline, and mutation
# testing (does a test fail when the code is changed?). Linux only, as macOS minutes cost ten times as much, and
# never on every push: weekly on main, or by hand on a branch (Actions > quality > Run workflow). See
# docs/quality.md for how to read the results.
on:
  workflow_dispatch:
    inputs:
      mutants:
        description: "Mutation testing: 'diff' (the lines this branch changes against main), 'none', or a file such as crates/core/src/sanitize.rs"
        default: diff
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LLVM_COV_VERSION: 0.9.1
  MUTANTS_VERSION: 27.1.0
  NEXTEST_VERSION: 0.9.148

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-llvm-cov@$LLVM_COV_VERSION
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Summary
        run: |
          cargo llvm-cov report --summary-only > coverage.txt
          { echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            lcov.info
            coverage.txt

  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Linux GUI build and run dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev xvfb xdotool libxkbcommon-x11-0 libegl1 libgl1-mesa-dri
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p klefki -p klefki-cli
      - name: Start-up and memory
        run: scripts/perf-baseline.py --runs 7 --json baseline.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: baseline
          path: baseline.json

  mutants:
    if: github.event_name == 'workflow_dispatch' && inputs.mutants != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # nextest: see .cargo/mutants.toml.
      - run: cargo install --locked cargo-mutants@$MUTANTS_VERSION cargo-nextest@$NEXTEST_VERSION
      - name: Mutants
        env:
          SCOPE: ${{ inputs.mutants }}
        run: |
          if [ "$SCOPE" = diff ]; then
            git diff origin/main...HEAD > branch.diff
            cargo mutants --in-diff branch.diff --jobs 2 --no-shuffle || status=$?
          else
            cargo mutants --file "$SCOPE" --jobs 2 --no-shuffle || status=$?
          fi
          # 2 (mutants missed) and 3 (mutants that hang) are results to read, not a broken run. Anything else is.
          { echo '### Missed mutants'; echo '```'; cat mutants.out/missed.txt 2>/dev/null; echo '```'; echo '### Timed out'; echo '```'; cat mutants.out/timeout.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          case "${status:-0}" in 0|2|3) ;; *) exit "$status" ;; esac
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants
          path: mutants.out
