name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libegl1 libgl1-mesa-dri
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The look tests' pictures that differ, with a picture of the difference (crates/app/src/shell/look.rs).
      - name: Changed pictures
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: look-changes
          path: |
            crates/app/src/shell/look/*.new.png
            crates/app/src/shell/look/*.diff.png
          if-no-files-found: ignore
      # Broken links in doc comments (ripgrep's CI does the same). Linux only: the docs are the same everywhere.
      - name: Doc comments
        if: runner.os == 'Linux'
        run: cargo doc --no-deps --document-private-items --workspace
        env:
          RUSTDOCFLAGS: -D warnings
